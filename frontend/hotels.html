<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Search – Travel Cost Assistant</title>
  <script src="/config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #1a73e8; --blue-dark: #1557b0; --blue-light: #e8f0fe;
      --bg: #f0f4f8; --surface: #ffffff; --border: #dadce0;
      --text: #202124; --muted: #5f6368; --red: #d93025;
    }

    body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); min-height: 100vh; }

    header {
      background: var(--blue); color: #fff; padding: 14px 24px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
    }
    header h1 { font-size: 18px; font-weight: 600; }
    .hdr-right { margin-left: auto; }
    .back-link {
      color: #fff; font-size: 13px; text-decoration: none;
      background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4);
      padding: 6px 14px; border-radius: 6px;
    }
    .back-link:hover { background: rgba(255,255,255,.3); }

    .container { max-width: 960px; margin: 24px auto; padding: 0 16px; }

    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }

    .search-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    .search-row input {
      flex: 1; min-width: 140px; padding: 9px 14px;
      border: 1.5px solid var(--border); border-radius: 20px;
      font-size: 13px; font-family: inherit; outline: none;
    }
    .search-row input:focus { border-color: var(--blue); }
    .search-row button {
      background: var(--blue); color: #fff; border: none; border-radius: 20px;
      padding: 9px 20px; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .search-row button:hover { background: var(--blue-dark); }
    .search-row button:disabled { background: #bbb; cursor: not-allowed; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { background: var(--blue-light); color: var(--blue); font-weight: 600; font-size: 12px; }
    tr:hover td { background: #f8f9fa; }

    .pagination { display: flex; justify-content: center; margin-top: 18px; }
    .pagination button {
      background: var(--surface); border: 1.5px solid var(--blue); color: var(--blue);
      border-radius: 20px; padding: 8px 24px; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .pagination button:hover { background: var(--blue-light); }
    .pagination button:disabled { border-color: #bbb; color: #bbb; cursor: not-allowed; }

    .muted { color: var(--muted); font-size: 13px; }
    .error { color: var(--red); font-size: 13px; }
  </style>
</head>
<body>

<header>
  <span style="font-size:22px">🏨</span>
  <h1>Hotel Search</h1>
  <div class="hdr-right">
    <a href="/" class="back-link">← Back to Chat</a>
  </div>
</header>

<div class="container">
  <div class="card">
    <div class="search-row">
      <input type="text" id="city-input" placeholder="City (e.g. Goa)" />
      <button id="search-btn" onclick="startSearch()">Search</button>
    </div>

    <div id="results-wrap"><p class="muted">Enter a city to find hotels.</p></div>

    <div class="pagination" id="pagination" style="display:none">
      <button id="next-btn" onclick="loadNextPage()">Next Page →</button>
    </div>
  </div>
</div>

<script>
let currentCity = '';
let nextPageToken = null;

async function startSearch() {
  const city = document.getElementById('city-input').value.trim();
  if (!city) return;
  currentCity = city;
  nextPageToken = null;
  await fetchPage();
}

async function loadNextPage() {
  if (!nextPageToken) return;
  await fetchPage(nextPageToken);
}

async function fetchPage(pageToken = null) {
  const wrap = document.getElementById('results-wrap');
  const btn = document.getElementById('search-btn');
  const nextBtn = document.getElementById('next-btn');
  const pagination = document.getElementById('pagination');

  btn.disabled = true;
  nextBtn.disabled = true;
  wrap.innerHTML = '<p class="muted">Searching…</p>';

  try {
    const params = new URLSearchParams({ city: currentCity });
    if (pageToken) params.set('page_token', pageToken);

    const res = await fetch(`${BACKEND}/api/hotels/search/page?${params.toString()}`);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      wrap.innerHTML = `<p class="error">${err.detail || 'Search failed'}</p>`;
      pagination.style.display = 'none';
      return;
    }

    const data = await res.json();
    renderResults(data.hotels || [], pageToken !== null);
    nextPageToken = data.next_page_token || null;
    pagination.style.display = nextPageToken ? 'flex' : 'none';
  } catch (e) {
    wrap.innerHTML = `<p class="error">Network error: ${e.message}</p>`;
    pagination.style.display = 'none';
  } finally {
    btn.disabled = false;
    nextBtn.disabled = false;
  }
}

function renderResults(hotels, append) {
  const wrap = document.getElementById('results-wrap');

  if (!hotels.length && !append) {
    wrap.innerHTML = '<p class="muted">No hotels found for this city.</p>';
    return;
  }

  let html = `<table>
    <thead><tr>
      <th>Hotel</th><th>Rate/Night</th><th>Rating</th><th>Contact Number</th><th>Address</th>
    </tr></thead><tbody>`;

  for (const h of hotels) {
    const rate = h.rate_per_night || h.estimated_rate;
    html += `<tr>
      <td style="font-weight:600">${h.name || ''}</td>
      <td>${rate ? '₹' + Number(rate).toLocaleString() : 'N/A'}</td>
      <td>${h.rating || '—'}</td>
      <td>${h.phone || 'N/A'}</td>
      <td style="font-size:12px;color:var(--muted)">${h.address || ''}</td>
    </tr>`;
  }

  html += '</tbody></table>';
  wrap.innerHTML = html;
}

document.getElementById('city-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') startSearch();
});
</script>
</body>
</html>
