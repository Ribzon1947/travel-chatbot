services:

  # ── App 1: Travel Cost Chatbot (Python FastAPI) ───────────────────────────
  - type: web
    name: travel-chatbot
    runtime: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_AI_KEY
        sync: false        # Set manually in Render dashboard
      - key: ADMIN_PASSWORD
        sync: false        # Set manually in Render dashboard
      # Uncomment + add a disk below to persist admin pricing changes ($1/mo):
      # - key: DATA_DIR
      #   value: /data
    # disk:
    #   name: pricing-data
    #   mountPath: /data
    #   sizeGB: 1

  # ── App 2: Sheets / PDF Analyzer (Node.js) ───────────────────────────────
  - type: web
    name: sheets-analyzer
    runtime: node
    region: singapore
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: GOOGLE_AI_KEY
        sync: false        # Set manually in Render dashboard
      - key: SERVICE_ACCOUNT_JSON
        sync: false        # Paste contents of credentials/service_account.json
