services:

  - type: web
    name: travel-chatbot
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_AI_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AGENT_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        value: sqlite:////tmp/chatbot/chatbot.db
      - key: FHE_DIR
        value: /tmp/chatbot/.fhe

  - type: web
    name: sheets-analyzer
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: GOOGLE_AI_KEY
        sync: false
      - key: SERVICE_ACCOUNT_JSON
        sync: false
