services:

  - type: web
    name: travel-chatbot
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_AI_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: sheets-analyzer
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: GOOGLE_AI_KEY
        sync: false
      - key: SERVICE_ACCOUNT_JSON
        sync: false
